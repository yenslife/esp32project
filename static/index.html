<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XIAO ESP32-S3 智慧監視器</title>
  <style>
    :root {
      --bg: #111315;
      --panel: #191c20;
      --panel-2: #21252b;
      --border: #2d323b;
      --text: #eceff4;
      --muted: #9aa3b2;
      --accent: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.45;
      padding: 18px 22px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .title-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.2px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
    .dot.online { background: var(--green); }
    .dot.rec { background: var(--red); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }

    .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 7px 13px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { border-color: #4b5563; }
    button.btn-on { background: #166534; border-color: #22c55e; color: #dcfce7; }
    button.btn-off { background: #7f1d1d; border-color: #ef4444; color: #fee2e2; }
    button.btn-audio-active { background: #1d4ed8; border-color: #60a5fa; color: #eff6ff; }
    button.btn-back { background: #1e3a8a; border-color: #60a5fa; color: #eff6ff; padding: 5px 11px; font-size: 12px; }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(330px, 0.95fr);
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 960px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
    .card-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 600;
    }
    .muted { color: var(--muted); font-size: 12px; font-weight: 400; text-decoration: none; }
    a.muted:hover { color: var(--text); text-decoration: underline; }
    .rotation-control {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .rotation-control select {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 7px;
      font: inherit;
    }

    .viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #090a0c;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .viewport > canvas, .viewport > video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
      transform: translate(-50%, -50%) rotate(var(--view-rotation, 0deg));
    }
    .viewport[data-sideways] { aspect-ratio: 3 / 4; }
    .viewport[data-sideways] > canvas, .viewport[data-sideways] > video {
      width: calc(100% * 4 / 3);
      height: 75%;
    }
    .viewport > video { display: none; }
    .overlay-badges {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }
    .badge {
      background: rgba(15, 17, 21, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .badge.rec-active {
      background: rgba(127, 29, 29, 0.88);
      border-color: var(--red);
      color: #fecaca;
    }
    .paused-mask {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(10, 12, 15, 0.82);
      color: var(--muted);
      font-size: 15px;
    }

    .trigger-modes {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .mode-label { font-size: 12px; color: var(--muted); margin-right: 4px; }
    .mode-btn {
      padding: 5px 11px;
      font-size: 12px;
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--muted);
    }
    .mode-btn.active {
      background: #1e3a8a;
      border-color: var(--accent);
      color: #eff6ff;
    }

    .meters-grid {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 640px) { .meters-grid { grid-template-columns: 1fr; } }
    .meter-box {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .meter-box.disabled { opacity: 0.45; }
    .motion-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      font-variant-numeric: tabular-nums;
    }
    .bar-track {
      height: 8px;
      background: #14171b;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.12s linear, background 0.12s;
    }
    .bar-fill.triggered { background: var(--amber); }
    .threshold-row {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    input[type="range"] { flex: 1; accent-color: var(--accent); }

    .event-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      max-height: 76vh;
      overflow-y: auto;
      padding-right: 2px;
    }
    .event-item {
      display: grid;
      grid-template-columns: 104px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 8px;
      border-radius: 8px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .event-item:hover { border-color: #4b5563; }
    .event-item.active { border-color: var(--accent); background: #1e2636; }
    .thumb {
      width: 104px;
      height: 78px;
      object-fit: cover;
      background: #0d0f12;
      border-radius: 5px;
      border: 1px solid var(--border);
    }
    .evt-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
    .evt-meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .tag {
      display: inline-block;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      background: #2b3240;
      color: #cbd5e1;
      margin-right: 4px;
    }
    .btn-del {
      padding: 5px 9px;
      font-size: 12px;
      color: var(--muted);
      background: transparent;
    }
    .btn-del:hover { color: #fecaca; border-color: var(--red); background: #451a1a; }
    .empty {
      padding: 28px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>XIAO ESP32-S3 智慧監視器</h1>
      <span class="pill">
        <span id="connDot" class="dot"></span>
        <span id="connText">連線檢查中...</span>
      </span>
      <span id="espStats" class="pill">RSSI -- dBm · Ring 0%</span>
    </div>
    <div class="header-actions">
      <button id="btnAudio" type="button">即時聽音：關閉</button>
      <button id="btnMonitor" type="button" class="btn-on">監控模式：開啟中</button>
    </div>
  </header>

  <main class="grid">
    <section>
      <div class="card">
        <div class="card-head">
          <span id="viewTitle">即時畫面（Live View）</span>
          <div id="liveHintGroup">
            <span class="muted">點擊右側歷史事件可直接在此視窗回放</span>
          </div>
          <div id="playbackActions" style="display:none; align-items:center; gap:10px;">
            <a id="downloadLink" class="muted" href="#" download>下載 MP4</a>
            <button id="btnBackLive" type="button" class="btn-back">← 返回即時畫面</button>
          </div>
          <label class="muted rotation-control">
            旋轉畫面
            <select id="viewRotation">
              <option value="0">0°</option>
              <option value="90">90°</option>
              <option value="180">180°</option>
              <option value="270">270°</option>
            </select>
          </label>
        </div>

        <div id="cameraViewport" class="viewport">
          <canvas id="liveCanvas" width="640" height="480"></canvas>
          <video id="eventVideo" controls playsinline></video>
          <div id="liveOverlays" class="overlay-badges">
            <span id="recBadge" class="badge">待機監控中</span>
            <span id="fpsBadge" class="badge">-- FPS</span>
          </div>
          <div id="pausedMask" class="paused-mask">監控已暫停</div>
        </div>

        <div class="trigger-modes">
          <span class="mode-label">事件錄影觸發條件：</span>
          <button type="button" class="mode-btn active" data-mode="either">畫面或聲音任一</button>
          <button type="button" class="mode-btn" data-mode="video">僅畫面變動</button>
          <button type="button" class="mode-btn" data-mode="audio">僅聲音變動</button>
          <button type="button" class="mode-btn" data-mode="both">畫面＋聲音同時</button>
        </div>

        <div class="meters-grid">
          <div id="videoMeterBox" class="meter-box">
            <div class="motion-labels">
              <span>畫面變動：<strong id="motionVal">0.0%</strong></span>
              <span>門檻：<strong id="thrVal">2.5%</strong></span>
            </div>
            <div class="bar-track">
              <div id="motionBar" class="bar-fill"></div>
            </div>
            <div class="threshold-row">
              <span>畫面門檻</span>
              <input id="thrSlider" type="range" min="0.5" max="15" step="0.5" value="2.5" />
            </div>
          </div>

          <div id="audioMeterBox" class="meter-box">
            <div class="motion-labels">
              <span>聲音變化：<strong id="audioVal">0.0%</strong></span>
              <span>門檻：<strong id="audioThrVal">3.5%</strong></span>
            </div>
            <div class="bar-track">
              <div id="audioBar" class="bar-fill"></div>
            </div>
            <div class="threshold-row">
              <span>聲音門檻</span>
              <input id="audioThrSlider" type="range" min="1.0" max="25" step="0.5" value="3.5" />
            </div>
          </div>
        </div>
      </div>
    </section>

    <aside class="card">
      <div class="card-head">
        <span>歷史事件錄影（<span id="evtCount">0</span>）</span>
        <span style="display:inline-flex; align-items:center; gap:5px;">
          <span class="muted">保留</span>
          <button type="button" class="mode-btn ret-btn" data-days="1" style="padding:2px 7px;">1天</button>
          <button type="button" class="mode-btn ret-btn" data-days="3" style="padding:2px 7px;">3天</button>
          <button type="button" class="mode-btn ret-btn active" data-days="7" style="padding:2px 7px;">7天</button>
        </span>
      </div>
      <div id="eventList" class="event-list">
        <div class="empty">尚無事件錄影，揮手或發出聲音即可觸發</div>
      </div>
    </aside>
  </main>

  <script>
    const canvas = document.getElementById("liveCanvas");
    const ctx = canvas.getContext("2d");
    const cameraViewport = document.getElementById("cameraViewport");
    const viewRotation = document.getElementById("viewRotation");
    const connDot = document.getElementById("connDot");
    const connText = document.getElementById("connText");
    const espStats = document.getElementById("espStats");
    const viewTitle = document.getElementById("viewTitle");
    const liveHintGroup = document.getElementById("liveHintGroup");
    const playbackActions = document.getElementById("playbackActions");
    const btnBackLive = document.getElementById("btnBackLive");
    const liveOverlays = document.getElementById("liveOverlays");
    const recBadge = document.getElementById("recBadge");
    const fpsBadge = document.getElementById("fpsBadge");
    const pausedMask = document.getElementById("pausedMask");
    const btnMonitor = document.getElementById("btnMonitor");
    const btnAudio = document.getElementById("btnAudio");

    const modeButtons = document.querySelectorAll(".mode-btn:not(.ret-btn)");
    const retButtons = document.querySelectorAll(".ret-btn");
    const videoMeterBox = document.getElementById("videoMeterBox");
    const audioMeterBox = document.getElementById("audioMeterBox");
    const motionVal = document.getElementById("motionVal");
    const thrVal = document.getElementById("thrVal");
    const motionBar = document.getElementById("motionBar");
    const thrSlider = document.getElementById("thrSlider");
    const audioVal = document.getElementById("audioVal");
    const audioThrVal = document.getElementById("audioThrVal");
    const audioBar = document.getElementById("audioBar");
    const audioThrSlider = document.getElementById("audioThrSlider");

    const eventList = document.getElementById("eventList");
    const evtCount = document.getElementById("evtCount");
    const eventVideo = document.getElementById("eventVideo");
    const downloadLink = document.getElementById("downloadLink");

    let monitoringEnabled = true;
    let currentMode = "either";
    let lastEventsKey = "";
    let cachedEvents = [];
    let activeEventId = null;
    let frameTimes = [];
    let drawing = false;

    // Web Audio 即時聽音：用 DataView 解讀奇數位移的 little-endian Int16 PCM，避免 Int16Array 對齊錯誤
    let audioEnabled = false;
    let audioCtx = null;
    let nextPlayTime = 0;

    function applyViewRotation(angle) {
      const rotation = ["0", "90", "180", "270"].includes(angle) ? angle : "0";
      viewRotation.value = rotation;
      cameraViewport.style.setProperty("--view-rotation", `${rotation}deg`);
      cameraViewport.toggleAttribute("data-sideways", rotation === "90" || rotation === "270");
    }

    function toggleLiveAudio() {
      audioEnabled = !audioEnabled;
      if (audioEnabled) {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const hp = audioCtx.createBiquadFilter();
          hp.type = "highpass";
          hp.frequency.value = 80;
          const comp = audioCtx.createDynamicsCompressor();
          const gain = audioCtx.createGain();
          gain.gain.value = 6.0;
          hp.connect(gain);
          gain.connect(comp);
          comp.connect(audioCtx.destination);
          audioCtx._entry = hp;
        }
        audioCtx.resume();
        nextPlayTime = audioCtx.currentTime + 0.12;
        btnAudio.textContent = "即時聽音：開啟中";
        btnAudio.className = "btn-audio-active";
      } else {
        btnAudio.textContent = "即時聽音：關閉";
        btnAudio.className = "";
      }
    }

    function playPcmChunk(arrayBuf) {
      if (!audioEnabled || !audioCtx || arrayBuf.byteLength < 3) return;
      const dv = new DataView(arrayBuf, 1);
      const count = dv.byteLength >> 1;
      const floats = new Float32Array(count);
      let sum = 0;
      for (let i = 0; i < count; i++) {
        const v = dv.getInt16(i * 2, true) / 32768.0;
        floats[i] = v;
        sum += v;
      }
      // 先扣除直流偏移再送進 Web Audio
      const mean = sum / count;
      for (let i = 0; i < count; i++) floats[i] -= mean;

      const buf = audioCtx.createBuffer(1, count, 16000);
      buf.getChannelData(0).set(floats);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx._entry);
      const now = audioCtx.currentTime;
      if (nextPlayTime < now || nextPlayTime > now + 0.45) nextPlayTime = now + 0.1;
      src.start(nextPlayTime);
      nextPlayTime += buf.duration;
    }

    function connectWs() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(`${proto}//${location.host}/ws/live`);
      ws.binaryType = "arraybuffer";
      ws.onmessage = async (ev) => {
        const bytes = new Uint8Array(ev.data);
        if (bytes.length < 2) return;
        const type = bytes[0];
        if (type === 2) {
          if (drawing || activeEventId !== null) return;
          drawing = true;
          try {
            const blob = new Blob([bytes.subarray(1)], { type: "image/jpeg" });
            const bmp = await createImageBitmap(blob);
            if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
              canvas.width = bmp.width;
              canvas.height = bmp.height;
            }
            ctx.drawImage(bmp, 0, 0);
            bmp.close();

            const now = performance.now();
            frameTimes.push(now);
            while (frameTimes.length > 1 && now - frameTimes[0] > 2500) frameTimes.shift();
            if (frameTimes.length > 1) {
              const fps = ((frameTimes.length - 1) * 1000) / (now - frameTimes[0]);
              fpsBadge.textContent = `${fps.toFixed(1)} FPS`;
            }
          } finally {
            drawing = false;
          }
        } else if (type === 1) {
          playPcmChunk(ev.data);
        }
      };
      ws.onclose = () => setTimeout(connectWs, 1200);
    }

    function fmtBytes(b) {
      return b >= 1048576 ? `${(b / 1048576).toFixed(1)} MB` : `${Math.round(b / 1024)} KB`;
    }

    function fmtTime(iso) {
      return (iso || "").replace("T", " ");
    }

    function updateActiveHighlight() {
      for (const el of eventList.querySelectorAll(".event-item")) {
        el.classList.toggle("active", el.dataset.id === activeEventId);
      }
    }

    function backToLive() {
      activeEventId = null;
      eventVideo.pause();
      eventVideo.removeAttribute("src");
      eventVideo.style.display = "none";
      canvas.style.display = "block";
      liveOverlays.style.display = "flex";
      liveHintGroup.style.display = "block";
      playbackActions.style.display = "none";
      viewTitle.textContent = "即時畫面（Live View）";
      pausedMask.style.display = monitoringEnabled ? "none" : "flex";
      updateActiveHighlight();
    }

    function playEvent(e) {
      if (activeEventId === e.id) {
        backToLive();
        return;
      }
      activeEventId = e.id;
      canvas.style.display = "none";
      liveOverlays.style.display = "none";
      pausedMask.style.display = "none";
      eventVideo.style.display = "block";
      liveHintGroup.style.display = "none";
      playbackActions.style.display = "flex";
      viewTitle.textContent = `事件回放 — ${fmtTime(e.started_at)}（${e.duration_s}s）`;
      downloadLink.href = e.video_url;
      eventVideo.src = e.video_url;
      eventVideo.play().catch(() => {});
      updateActiveHighlight();
    }

    async function loadEvents(force = false) {
      const res = await fetch("/api/events");
      const data = await res.json();
      const events = data.events || [];
      const key = events.map((e) => e.id).join(",");
      evtCount.textContent = events.length;
      if (!force && key === lastEventsKey) {
        updateActiveHighlight();
        return;
      }
      lastEventsKey = key;
      cachedEvents = events;

      if (!events.length) {
        eventList.innerHTML = '<div class="empty">尚無事件錄影，揮手或發出聲音即可觸發</div>';
        return;
      }
      eventList.innerHTML = "";
      for (const e of events) {
        const row = document.createElement("div");
        row.className = "event-item" + (e.id === activeEventId ? " active" : "");
        row.dataset.id = e.id;
        const thumb = e.thumb_url
          ? `<img class="thumb" src="${e.thumb_url}" alt="縮圖" loading="lazy" />`
          : `<div class="thumb"></div>`;
        const reason = e.trigger_reason || "畫面";
        const audioMeta = e.peak_audio_pct != null ? ` · 音 ${e.peak_audio_pct}%` : "";
        row.innerHTML = `
          ${thumb}
          <div>
            <div class="evt-title">${fmtTime(e.started_at)}</div>
            <div class="evt-meta">
              <span class="tag">${reason}</span>${e.duration_s}s · 畫 ${e.peak_motion_pct}%${audioMeta} · ${fmtBytes(e.size_bytes)}
            </div>
          </div>
          <button type="button" class="btn-del" title="刪除此段錄影">刪除</button>
        `;
        row.addEventListener("click", (ev) => {
          if (ev.target.closest(".btn-del")) return;
          playEvent(e);
        });
        row.querySelector(".btn-del").addEventListener("click", async (ev) => {
          ev.stopPropagation();
          await fetch(`/api/events/${encodeURIComponent(e.id)}`, { method: "DELETE" });
          if (activeEventId === e.id) backToLive();
          await loadEvents(true);
        });
        eventList.appendChild(row);
      }
    }

    function applyModeUI(mode) {
      currentMode = mode;
      modeButtons.forEach((b) => b.classList.toggle("active", b.dataset.mode === mode));
      videoMeterBox.classList.toggle("disabled", mode === "audio");
      audioMeterBox.classList.toggle("disabled", mode === "video");
    }

    async function pollStatus() {
      try {
        const res = await fetch("/api/status");
        const s = await res.json();
        monitoringEnabled = s.monitoring_enabled;

        connDot.className = "dot" + (s.connected ? " online" : "");
        connText.textContent = s.connected ? "ESP32 已連線" : "等待 ESP32 連線...";

        const esp = s.esp32 || {};
        const ringPct = esp.ring_size ? ((esp.ring_used / esp.ring_size) * 100).toFixed(1) : "0.0";
        espStats.textContent = `RSSI ${esp.rssi ?? "--"} dBm · Ring ${ringPct}% · 掉包 ${s.seq_gaps}`;

        btnMonitor.textContent = monitoringEnabled ? "監控模式：開啟中" : "監控模式：已暫停";
        btnMonitor.className = monitoringEnabled ? "btn-on" : "btn-off";
        if (activeEventId === null) {
          pausedMask.style.display = monitoringEnabled ? "none" : "flex";
          pausedMask.textContent = monitoringEnabled ? "" : "監控已暫停（點擊右上角可重新開啟）";
        }

        if (!monitoringEnabled) {
          recBadge.className = "badge";
          recBadge.textContent = "已暫停";
        } else if (s.recording_event) {
          recBadge.className = "badge rec-active";
          recBadge.innerHTML = '<span class="dot rec"></span> 錄製事件中 REC';
        } else {
          recBadge.className = "badge";
          recBadge.textContent = "待機監控中（前 5s 緩衝）";
        }

        if (s.trigger_mode && s.trigger_mode !== currentMode) {
          applyModeUI(s.trigger_mode);
        }
        if (s.retention_days) {
          retButtons.forEach((b) => b.classList.toggle("active", parseInt(b.dataset.days, 10) === s.retention_days));
        }

        const vPct = s.live_motion_pct || 0;
        const vThr = s.motion_threshold_pct || 2.5;
        motionVal.textContent = `${vPct.toFixed(1)}%`;
        thrVal.textContent = `${vThr.toFixed(1)}%`;
        if (document.activeElement !== thrSlider) thrSlider.value = vThr;
        motionBar.style.width = `${Math.min(100, (vPct / 25) * 100)}%`;
        motionBar.className = "bar-fill" + (vPct >= vThr ? " triggered" : "");

        const aPct = s.live_audio_pct || 0;
        const aThr = s.audio_threshold_pct || 3.5;
        audioVal.textContent = `${aPct.toFixed(1)}%`;
        audioThrVal.textContent = `${aThr.toFixed(1)}%`;
        if (document.activeElement !== audioThrSlider) audioThrSlider.value = aThr;
        audioBar.style.width = `${Math.min(100, (aPct / 40) * 100)}%`;
        audioBar.className = "bar-fill" + (aPct >= aThr ? " triggered" : "");

        await loadEvents();
      } catch (_) {
        connDot.className = "dot";
        connText.textContent = "伺服器離線";
      }
    }

    btnBackLive.addEventListener("click", backToLive);
    try {
      applyViewRotation(localStorage.getItem("camera-view-rotation"));
    } catch {
      applyViewRotation("0");
    }
    viewRotation.addEventListener("change", () => {
      applyViewRotation(viewRotation.value);
      try {
        localStorage.setItem("camera-view-rotation", viewRotation.value);
      } catch {
        // 瀏覽器禁止本機儲存時，這次的角度仍有效。
      }
    });

    btnMonitor.addEventListener("click", async () => {
      const next = !monitoringEnabled;
      await fetch(`/api/monitoring?enabled=${next}`, { method: "POST" });
      await pollStatus();
    });

    btnAudio.addEventListener("click", toggleLiveAudio);

    modeButtons.forEach((btn) => {
      btn.addEventListener("click", async () => {
        const m = btn.dataset.mode;
        applyModeUI(m);
        await fetch(`/api/trigger_config?mode=${m}`, { method: "POST" });
      });
    });

    retButtons.forEach((btn) => {
      btn.addEventListener("click", async () => {
        const d = parseInt(btn.dataset.days, 10);
        retButtons.forEach((b) => b.classList.toggle("active", b === btn));
        await fetch(`/api/trigger_config?retention_days=${d}`, { method: "POST" });
        await loadEvents(true);
      });
    });

    thrSlider.addEventListener("input", () => {
      thrVal.textContent = `${parseFloat(thrSlider.value).toFixed(1)}%`;
    });
    thrSlider.addEventListener("change", async () => {
      await fetch(`/api/trigger_config?motion_pct=${parseFloat(thrSlider.value)}`, { method: "POST" });
    });

    audioThrSlider.addEventListener("input", () => {
      audioThrVal.textContent = `${parseFloat(audioThrSlider.value).toFixed(1)}%`;
    });
    audioThrSlider.addEventListener("change", async () => {
      await fetch(`/api/trigger_config?audio_pct=${parseFloat(audioThrSlider.value)}`, { method: "POST" });
    });

    connectWs();
    pollStatus();
    setInterval(pollStatus, 1000);
  </script>
</body>
</html>
